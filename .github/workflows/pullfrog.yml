# PULLFROG ACTION — DOUBLE CHECK BEFORE EDIT. VERIFY WHAT ARE YOU DOING.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@cb3bda7d56a8728500c37e1eda718271e7ec4616 # v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action reads GH_TOKEN as its external token override
          # (utils/token.ts -> resolveTokens) and uses it for git, the MCP
          # GitHub tools and the `gh` CLI. A secret named ADVISORY_PAT is
          # never read, so the advisory API stayed unreachable for the
          # GHSA-r4rg-83vc-9wvw bookkeeping run.
          #
          # ADVISORY_PAT must be a PAT (classic `repo`, or fine-grained with
          # repository security advisories: write, administration: write for
          # the private advisory fork, and contents/pull requests/issues:
          # write) held by a user who may create repositories in this
          # organisation. When the secret is absent the value is empty and the
          # action falls back to its own scoped installation tokens.
          GH_TOKEN: ${{ secrets.ADVISORY_PAT }}
