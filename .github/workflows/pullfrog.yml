# PULLFROG ACTION — DOUBLE CHECK BEFORE EDIT. VERIFY WHAT ARE YOU DOING.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@54516f4396858c4117133fad1eda573a086e72a6 # v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
