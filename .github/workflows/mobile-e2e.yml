name: Mobile E2E (scratch)

on:
  push:
    branches: [mobile-e2e-runner]
  workflow_dispatch:

env:
  MULTI_THREADED_ADB: 1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout ownpay
        uses: actions/checkout@v5
        with:
          ref: mobile-e2e-runner
          path: core

      - name: Checkout ownpay mobile app
        uses: actions/checkout@v5
        with:
          repository: own-pay/OwnPay-Mobile-App
          ref: mobile-e2e-runner
          path: mobile

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Start ownpay stack (db + redis + app)
        run: cd core && docker compose up -d db cache app 2>&1 | tail -5

      - name: Bootstrap fresh install (.env + schema + seeds + marker)
        run: |
          cd core
          docker compose exec -T -e DB_HOST=db -e DB_PORT=3306 -e DB_USER=root -e DB_PASS=root \
            -e DB_NAME=ownpay -e DB_PREFIX=op_ app php /var/www/html/tools/bootstrap-e2e.php \
            --email=e2e@example.com --username=e2eadmin --password=Smashing!key-2026

      - name: Smoke - login page renders
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:8080/login -o /tmp/login.html && grep -q '_csrf_token' /tmp/login.html; then
              echo "LOGIN page OK"
              exit 0
            fi
            sleep 2
          done
          echo "LOGIN page failed to load"
          docker compose logs app | tail -50
          exit 1

      - name: Locate Android SDK and cache it
        id: android-sdk
        run: |
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /home/runner/android-sdk /opt/hostedtoolcache/android-sdk /usr/local/android-sdk; do
            if [ -d "$d/cmdline-tools" ]; then
              echo "android_home=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Android SDK not found. Checked above paths." >&2
          exit 1

      - name: Build debug APK (x86_64)
        run: |
          export ANDROID_HOME=${{ steps.android-sdk.outputs.android_home }}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cd "$GITHUB_WORKSPACE/mobile"
          flutter pub get
          flutter build apk --debug --target-platform android-x64 --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/app-debug.apk

      - name: Admin login + grab pairing OTP (fresh, 5-min TTL)
        run: |
          set -euo pipefail
          BASE=http://localhost:8080
          CJ=/tmp/cj.txt
          rm -f "$CJ"
          TOKEN=$(curl -sf -c "$CJ" "$BASE/login" | grep -oP 'name="_csrf_token"\s+value="\K[^"]+' | head -1)
          if [ -z "$TOKEN" ]; then
            echo "FAIL: no csrf_token in /login page"
            exit 1
          fi
          CODE=$(curl -s -o /tmp/login_resp.html -w '%{http_code}' -c "$CJ" -b "$CJ" \
            -X POST "$BASE/login" \
            --data-urlencode "_csrf_token=$TOKEN" \
            --data-urlencode "email=e2eadmin" \
            --data-urlencode "password=Smashing!key-2026")
          echo "POST /login -> HTTP $CODE"
          PAGE=$(curl -sf -c "$CJ" -b "$CJ" "$BASE/admin/devices")
          TOKEN2=$(printf '%s' "$PAGE" | grep -oP 'name="_csrf_token"\s+value="\K[^"]+' | head -1)
          if [ -z "$TOKEN2" ]; then
            echo "FAIL: no csrf_token on /admin/devices (auth or permission problem)"
            printf '%s' "$PAGE" | head -c 600
            exit 1
          fi
          RESP=$(curl -sf -b "$CJ" -X POST "$BASE/admin/devices/generate-otp" -H "X-CSRF-Token: $TOKEN2")
          printf '%s' "$RESP" > /tmp/otp.json
          printf '%s' "$RESP" | grep -oP '"otp"\s*:\s*"\K[0-9]{6}' > /tmp/otp.txt || true
          if [ ! -s /tmp/otp.txt ]; then
            echo "FAIL: generate-otp returned no otp"
            printf '%s' "$RESP" | head -c 400
            exit 1
          fi
          echo "Pairing OTP acquired (expires in 300s)"

      - name: Set up Android emulator (API 35 aosp_atd x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: medium_phone
          script: |
            set -x
            adb wait-for-device
            adb devices -l
            adb shell wm size
            adb shell wm density
            adb install /tmp/app-debug.apk
            adb reverse tcp:8080 tcp:8080
            adb shell pm grant org.ownpay.console android.permission.RECEIVE_SMS
            adb shell pm grant org.ownpay.console android.permission.READ_SMS
            adb shell pm grant org.ownpay.console android.permission.CAMERA
            adb shell monkey -p org.ownpay.console -c android.intent.category.LAUNCHER 1
            sleep 12
            mkdir -p /tmp/e2e
            adb shell screencap -p /sdcard/e2e-0.png
            adb pull /sdcard/e2e-0.png /tmp/e2e/e2e-0.png || true
            adb shell uiautomator dump /sdcard/ui-0.xml || true
            adb pull /sdcard/ui-0.xml /tmp/e2e/ui-0.xml || true
            adb logcat -d -t 300 > /tmp/e2e/logcat.txt || true

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: /tmp/e2e/
          if-no-files-found: ignore
          retention-days: 7
