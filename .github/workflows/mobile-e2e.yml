name: Mobile E2E (scratch)

on:
  push:
    branches: [mobile-e2e-runner]
  workflow_dispatch:

env:
  MULTI_THREADED_ADB: 1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout ownpay
        uses: actions/checkout@v5
        with:
          ref: mobile-e2e-runner
          path: core

      - name: Checkout ownpay mobile app
        uses: actions/checkout@v5
        with:
          repository: own-pay/OwnPay-Mobile-App
          ref: mobile-e2e-runner
          path: mobile

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Start ownpay stack (db + redis + app)
        run: cd core && docker compose up -d db cache app 2>&1 | tail -5

      - name: Bootstrap fresh install (.env + schema + seeds + marker)
        run: |
          cd core
          docker compose exec -T -e DB_HOST=db -e DB_PORT=3306 -e DB_USER=root -e DB_PASS=root \
            -e DB_NAME=ownpay -e DB_PREFIX=op_ app php /var/www/html/tools/bootstrap-e2e.php \
            --email=e2e@example.com --username=e2eadmin --password=Smashing!key-2026

      - name: Smoke - login page renders
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:8080/login -o /tmp/login.html && grep -q '_csrf_token' /tmp/login.html; then
              echo "LOGIN page OK"
              exit 0
            fi
            sleep 2
          done
          echo "LOGIN page failed to load"
          docker compose logs app | tail -50
          exit 1

      - name: Locate Android SDK and cache it
        id: android-sdk
        run: |
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk /home/runner/android-sdk /opt/hostedtoolcache/android-sdk /usr/local/android-sdk; do
            if [ -d "$d/cmdline-tools" ]; then
              echo "android_home=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Android SDK not found. Checked above paths." >&2
          exit 1

      - name: Build debug APK (x86_64)
        run: |
          export ANDROID_HOME=${{ steps.android-sdk.outputs.android_home }}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          cd "$GITHUB_WORKSPACE/mobile"
          flutter pub get
          flutter build apk --debug --target-platform android-x64 --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/app-debug.apk

      - name: Set up Android emulator (API 35 aosp_atd x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          script: |
            bash $GITHUB_WORKSPACE/core/tools/mobile-e2e-emulator.sh

      - name: Verify device paired in core DB
        if: always()
        run: |
          cd core
          docker compose exec -T db mysql -uroot -proot ownpay -e "SELECT device_name, platform, status, paired_at FROM op_paired_devices ORDER BY id DESC LIMIT 3"

      - name: Verify SMS captured and parsed by core
        if: always()
        run: |
          cd core
          docker compose exec -T db mysql -uroot -proot ownpay -e "SELECT sender, amount, trx_id, gateway_slug, match_status FROM op_sms_parsed ORDER BY id DESC LIMIT 5"
          if ! docker compose exec -T db mysql -uroot -proot ownpay -e "SELECT 1 FROM op_sms_parsed WHERE trx_id = '8N7XYZ1234'" | grep -q 1; then
            echo "FAIL: expected parsed SMS row for TrxID 8N7XYZ1234 not found"
            exit 1
          fi
          if docker compose exec -T db mysql -uroot -proot ownpay -e "SELECT 1 FROM op_sms_parsed WHERE trx_id IN ('BAD0000ZZZ','NOTE001')" | grep -q 1; then
            echo "FAIL: dropped SMS (non-whitelisted sender or negative keyword) reached the core"
            exit 1
          fi
          echo "SMS matrix OK: whitelisted bKash parsed; bad sender and OTP-keyword message absent"

      - name: Security checks on captured evidence
        if: always()
        run: |
          # At-rest: the native buffer and the Hive queue must hold only AES-GCM ciphertext.
          # Plaintext body markers (TrxID / amount strings from the injected SMS) must NOT
          # appear anywhere in the private-state dump.
          if [ -d /tmp/e2e/at-rest ]; then
            if grep -ariE '8ATREST001|3,300\.00|Never share' /tmp/e2e/at-rest/ >/dev/null; then
              echo "FAIL: plaintext SMS body content found in at-rest private state"
              grep -ariE '8ATREST001|Never share' /tmp/e2e/at-rest/ | head -3
              exit 1
            fi
            echo "at-rest private state contains no plaintext SMS body markers"
          fi
          if [ -f /tmp/e2e/logcat.txt ] && grep -qiE '8N7XYZ1234|8ATREST001|Never share|BAD0000ZZZ' /tmp/e2e/logcat.txt; then
            echo "FAIL: SMS body leaked to logcat"
            exit 1
          fi
          echo "Security evidence OK (at-rest ciphertext, logcat clean)"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: /tmp/e2e/
          if-no-files-found: ignore
          retention-days: 7
